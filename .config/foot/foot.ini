[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=Maple Mono NF CN:size=15
pad=14x14
initial-window-mode=windowed
workers=0
shell=/usr/bin/nu

# 透過 + 背景ぼかし。foot の alpha/blur は色セクションに置く（このビルドでは
# [colors] ではなく [colors-dark]。テーマ側も同じ場所に blur=yes を置いている）。
# blur は foot が ext-background-effect-v1 でコンポジタに要求する方式。
# Ghostty はこのプロトコル未対応で Hyprland 上では背景がぼけないため、
# フローティング端末は foot で出す。
[colors-dark]
alpha=0.8
blur=yes

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
